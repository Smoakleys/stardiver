<body>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@500;600;700&family=Instrument+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
/* Stardiver loop prototype v2. A game screen, so one dark theme by choice. Portrait-first; landscape is a re-layout, not a different game. */
:root{--bg:#070a12;--panel:#0c1322;--panel2:#101a2e;--fg:#eaf2ff;--muted:#8f9bb3;--line:#ffffff1c;--accent:#ffc94a;--ally:#4fe3ff;--foe:#ff4d5e;--good:#7dffb0;
--display:"Chakra Petch",ui-sans-serif,system-ui,sans-serif;--body:"Instrument Sans",ui-sans-serif,system-ui,sans-serif;--mono:"IBM Plex Mono",ui-monospace,Menlo,monospace;
--sat:env(safe-area-inset-top,0px);--sab:env(safe-area-inset-bottom,0px);--sal:env(safe-area-inset-left,0px);--sar:env(safe-area-inset-right,0px);color-scheme:dark}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:var(--bg);color:var(--fg);overflow:hidden;overscroll-behavior:none}
body{font:14px/1.4 var(--body);-webkit-text-size-adjust:100%;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
button{font:inherit;color:inherit;-webkit-tap-highlight-color:transparent;touch-action:manipulation}

/* the game surface: full screen on phones, a phone-sized frame on desktop */
#app{position:fixed;inset:0;overflow:hidden;background:#05070d;container-type:size}
html:not(.sd-touch) body{background:radial-gradient(120% 90% at 50% 0%,#141c30,#05070d 70%)}
html:not(.sd-touch) #app{inset:auto;left:50%;top:calc(50% - 18px);transform:translate(-50%,-50%);height:min(866px,calc(100dvh - 90px));aspect-ratio:400/866;border-radius:40px;border:9px solid #1a1f2b;box-shadow:0 40px 120px -30px #000,0 0 0 1px #2c3344;--sat:26px;--sab:16px}
html:not(.sd-touch).land #app{height:auto;width:min(866px,calc(100vw - 60px));aspect-ratio:866/400;--sat:0px;--sab:12px;--sal:30px;--sar:30px}
.dev{position:fixed;left:50%;bottom:14px;transform:translateX(-50%);display:flex;gap:8px;font:500 12px var(--mono);letter-spacing:.08em}
html.sd-touch .dev{display:none}
.dev button{all:unset;cursor:pointer;padding:8px 12px;border:1px solid #ffffff2a;background:#0c1322;color:#c9d4e6}
.dev button[aria-pressed=true]{border-color:var(--accent);color:var(--accent)}
#c{position:absolute;inset:0;width:100%;height:100%;display:block;touch-action:none}
#labels,#fx,#coach{position:absolute;inset:0;pointer-events:none;overflow:hidden}
.ls{position:absolute;inset:0}
.ls[hidden]{display:none}

/* ---------- world labels ---------- */
.bl{position:absolute;left:0;top:0;display:grid;justify-items:center;gap:3px;will-change:transform;font-family:var(--display);text-shadow:0 1px 4px #000c}
.bl .nm{display:flex;align-items:center;gap:5px;background:#08101ecc;border:1px solid #ffffff22;padding:2px 7px 2px 3px;font-size:11px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;white-space:nowrap;pointer-events:auto;cursor:pointer}
.bl .lv{background:var(--ally);color:#02141a;font:700 10px/1 var(--mono);padding:3px 4px;text-shadow:none}
.bl.empty .nm{border-style:dashed;border-color:#4fe3ff66;color:#bff6ff}
.bl.empty .lv{background:transparent;color:var(--ally);border:1px solid var(--ally);padding:2px 3px}
.bl.locked .nm{color:#8f9bb3}.bl.locked .lv{background:#3a4458;color:#c9d4e6}
.bl .tm{font:500 10px/1 var(--mono);color:#ffe7a8;background:#1a1405cc;border:1px solid #ffc94a55;padding:3px 5px;display:flex;gap:6px;align-items:center}
.bl .tm i{display:block;width:44px;height:4px;background:#ffffff22;position:relative}
.bl .tm i b{position:absolute;inset:0 auto 0 0;background:var(--accent)}
.bub{all:unset;pointer-events:auto;cursor:pointer;width:42px;height:42px;border-radius:50%;display:grid;place-items:center;background:radial-gradient(circle at 35% 30%,#ffffff,#d9f6ff 30%,#4fe3ff 75%);box-shadow:0 0 0 2px #ffffffaa,0 0 18px #4fe3ffaa;animation:bob 1.6s ease-in-out infinite;font:700 10px/1 var(--mono);color:#02141a;text-shadow:none}
.bub.fuel{background:radial-gradient(circle at 35% 30%,#fff,#ffe1c2 30%,#ff9b4a 75%);box-shadow:0 0 0 2px #ffffffaa,0 0 18px #ff9b4aaa}
.bub.credits{background:radial-gradient(circle at 35% 30%,#fff,#fff0b8 30%,#ffc94a 75%);box-shadow:0 0 0 2px #ffffffaa,0 0 18px #ffc94aaa}
.bub.troops{background:radial-gradient(circle at 35% 30%,#fff,#d6ffe6 30%,#7dffb0 75%);box-shadow:0 0 0 2px #ffffffaa,0 0 18px #7dffb0aa}
.bub svg{width:20px;height:20px}
@keyframes bob{50%{transform:translateY(-5px)}}
.pl,.sys{position:absolute;left:0;top:0;display:grid;justify-items:center;gap:1px;white-space:nowrap;will-change:transform;font-family:var(--display);text-shadow:0 1px 6px #000}
.sys .n{font-size:12px;font-weight:700;letter-spacing:.3em;color:#dfe8ff99}
.sys .f{display:none}
.pl .n{font-size:11px;font-weight:600;letter-spacing:.12em}
.pl .f{font:500 9px/1.2 var(--mono);letter-spacing:.12em;color:#c9d4e6}
.pl.ally .n{color:#bff6ff}.pl.foe .n{color:#ffb3ba}.pl.war .n{color:#ffe7a8}.pl.neu .n{color:#c9d4e6}
.pl .mini{width:46px;height:3px;background:var(--foe);position:relative;overflow:hidden;margin-top:2px}
.pl .mini i{position:absolute;inset:0 auto 0 0;background:var(--ally)}
.pl.neu .mini,.pl.ally .mini{display:none}
.pl .base{display:grid;place-items:center;width:20px;height:20px;border:1.5px solid var(--ally);transform:rotate(45deg);margin-bottom:4px;background:#04202acc}
.pl .base span{transform:rotate(-45deg);font-size:11px;color:var(--ally)}
.pl.sel .n{color:#fff;text-decoration:underline;text-decoration-color:var(--accent);text-underline-offset:4px;text-decoration-thickness:2px}
.mk{position:absolute;left:0;top:0;font:600 10px/1 var(--mono);letter-spacing:.08em;white-space:nowrap;padding:3px 5px;will-change:transform;pointer-events:none}
.mk.drd{color:#ffd0d4;background:#3a0a10cc;border:1px solid #ff4d5e88}
.mk.lz{color:#bff6ff;background:#04202acc;border:1px solid #4fe3ff88}
.mk.plat{color:#ffe7a8;background:#1a1405cc;border:1px solid #ffc94a66;font-size:9px}
.mk.army{color:#bff6ff;background:#04202acc;border:1px solid #4fe3ff55;font-size:9px}
.ftx{position:absolute;left:0;top:0;font:700 15px/1 var(--display);letter-spacing:.06em;color:#fff;text-shadow:0 2px 6px #000;white-space:nowrap;animation:rise 1.5s ease-out forwards}
@keyframes rise{from{opacity:0;translate:-50% 0}15%{opacity:1}to{opacity:0;translate:-50% -46px}}
.fly{position:absolute;left:0;top:0;width:14px;height:14px;transform:rotate(45deg);transition:transform .7s cubic-bezier(.5,-0.2,.6,1),opacity .7s;z-index:40}

/* ---------- HUD ---------- */
.hud{position:absolute;inset:0;pointer-events:none;font-family:var(--display)}
.hud>*{pointer-events:auto}
.top{position:absolute;left:calc(10px + var(--sal));right:calc(10px + var(--sar));top:calc(8px + var(--sat));display:grid;gap:6px}
.r1{display:flex;align-items:center;gap:8px}
.pow{display:flex;align-items:center;gap:8px;background:linear-gradient(90deg,#0c1322ee,#0c132288);border:1px solid #ffffff1f;padding:4px 10px 4px 4px}
.ava{width:34px;height:34px;display:grid;place-items:center;background:#13213a;border:1px solid #4fe3ff66}
.ava svg{width:24px;height:24px}
.pow .k{font:500 9px/1 var(--mono);letter-spacing:.2em;color:#b9c7dc}
.pow .v{font-size:19px;font-weight:700;letter-spacing:.03em;font-variant-numeric:tabular-nums;line-height:1.05;transition:color .3s}
.pow .v.up{color:var(--good)}
.icb{all:unset;cursor:pointer;margin-left:auto;width:40px;height:40px;display:grid;place-items:center;border:1px solid #ffffff22;background:#0c1322cc}
.icb svg{width:20px;height:20px}
.res{display:grid;grid-template-columns:repeat(4,1fr);gap:4px}
.res span{display:flex;align-items:center;gap:6px;background:#0c1322cc;border:1px solid #ffffff17;padding:5px 7px;font:500 12px/1 var(--mono);font-variant-numeric:tabular-nums;min-width:0;overflow:hidden}
.res i{width:9px;height:9px;flex:none;transform:rotate(45deg)}
.res span.pulse{border-color:#ffffff88}
.chips{position:absolute;left:calc(10px + var(--sal));top:calc(96px + var(--sat));display:grid;gap:5px;justify-items:start;max-width:66%}
.chip{all:unset;cursor:pointer;display:flex;align-items:center;gap:7px;background:#0c1322e6;border:1px solid #ffffff22;border-left:3px solid var(--ally);padding:5px 6px 5px 8px;font:500 11px/1.1 var(--mono);color:#dbe7ff;min-height:30px}
.chip.b{border-left-color:var(--accent)}.chip.w{border-left-color:var(--foe)}.chip.t{border-left-color:var(--good)}
.chip em{font-style:normal;color:#fff}
.chip .free{background:var(--good);color:#04140a;font:700 10px/1 var(--display);letter-spacing:.12em;padding:6px 8px;animation:glow 1.2s ease-in-out infinite}
@keyframes glow{50%{box-shadow:0 0 12px #7dffb0}}
.chip .pg{width:42px;height:4px;background:#ffffff22;position:relative}.chip .pg b{position:absolute;inset:0 auto 0 0;background:var(--accent)}
.toasts{position:absolute;left:50%;transform:translateX(-50%);top:calc(98px + var(--sat));display:grid;gap:6px;justify-items:center;width:min(92%,420px);pointer-events:none;z-index:30}
.toast{background:#0c1322f2;border:1px solid #ffffff2a;padding:8px 12px;font:500 12.5px/1.35 var(--body);color:#e6efff;animation:tin .25s ease-out;text-align:center}
.toast.gold{border-color:#ffc94a99;color:#fff1c9}.toast.warn{border-color:#ff4d5e99;color:#ffd0d4}.toast.drd{border-color:#ff4d5e55;color:#ffd0d4;font-family:var(--mono);font-size:11.5px}
@keyframes tin{from{opacity:0;transform:translateY(-6px)}}

.bot{position:absolute;left:0;right:0;bottom:0;padding:0 calc(8px + var(--sar)) calc(6px + var(--sab)) calc(8px + var(--sal));display:grid;gap:6px;background:linear-gradient(0deg,#05070dee 40%,#05070d00)}
.mis{all:unset;cursor:pointer;display:grid;grid-template-columns:36px 1fr auto;align-items:center;gap:10px;background:linear-gradient(90deg,#14203aee,#0c1322ee);border:1px solid #ffffff22;border-left:3px solid var(--accent);padding:7px 7px 7px 9px;min-height:50px}
.mis .ic{width:36px;height:36px;display:grid;place-items:center;background:#1a1405;border:1px solid #ffc94a66;color:var(--accent);font:700 13px var(--display)}
.mis .tx{display:grid;gap:2px;min-width:0}
.mis .k{font:500 9px/1 var(--mono);letter-spacing:.18em;color:var(--accent)}
.mis .t{font-size:13.5px;font-weight:600;line-height:1.2}
.mis .rw{font:500 10px/1.2 var(--mono);color:#b9c7dc}
.go{all:unset;cursor:pointer;min-width:62px;height:40px;display:grid;place-items:center;font:700 13px var(--display);letter-spacing:.14em;background:var(--accent);color:#1a1300}
.go.claim{background:var(--good);color:#04140a;animation:glow 1.1s ease-in-out infinite}
.nav{display:grid;grid-template-columns:repeat(4,1fr);gap:4px}
.nav button{all:unset;cursor:pointer;position:relative;display:grid;justify-items:center;gap:3px;padding:6px 0 4px;font:600 10px/1 var(--display);letter-spacing:.14em;color:#9fb0cc;text-transform:uppercase;border-top:2px solid transparent}
.nav button svg{width:22px;height:22px}
.nav button[aria-current=true]{color:#fff;border-top-color:var(--accent)}
.badge{position:absolute;top:2px;left:calc(50% + 6px);min-width:16px;height:16px;border-radius:8px;background:var(--foe);color:#fff;font:700 10px/16px var(--mono);text-align:center;padding:0 4px}
.weap{position:absolute;right:calc(10px + var(--sar));bottom:calc(150px + var(--sab));display:grid;gap:10px;justify-items:center}
.wb{all:unset;cursor:pointer;width:62px;height:62px;border-radius:50%;display:grid;place-items:center;position:relative;background:#0c1322ee;border:1.5px solid #ffc94a99;color:#fff1c9}
.wb svg{width:24px;height:24px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.wb .cd{position:absolute;inset:-1.5px;border-radius:50%;pointer-events:none}
.wb span{position:absolute;bottom:-15px;font:600 9px/1 var(--display);letter-spacing:.16em;color:#ffe7a8;text-shadow:0 1px 3px #000}
.wb.off{opacity:.45;border-color:#ffffff44}
.wb.ready{box-shadow:0 0 0 0 #ffc94a;animation:ring 1.6s ease-out infinite}
@keyframes ring{0%{box-shadow:0 0 0 0 #ffc94a88}100%{box-shadow:0 0 0 14px #ffc94a00}}
.aimbar{position:absolute;left:calc(10px + var(--sal));right:calc(10px + var(--sar));bottom:calc(var(--botH,124px) + 8px);display:grid;gap:8px;z-index:20}
.aimbar .hint{background:#0c1322f2;border:1px solid #ffc94a77;padding:10px 12px;font:500 13px/1.35 var(--body);text-align:center}
.aimbar .hint b{color:#fff1c9}
.aimbar .row{display:grid;grid-template-columns:1fr 2fr;gap:8px}
.btn{all:unset;cursor:pointer;box-sizing:border-box;min-height:46px;display:grid;place-items:center;text-align:center;font:700 13px/1 var(--display);letter-spacing:.14em;text-transform:uppercase;border:1px solid #ffffff33;background:#0c1322f2;color:#eaf2ff;padding:0 14px}
.btn.pri{background:var(--accent);border-color:var(--accent);color:#1a1300}
.btn.grn{background:var(--good);border-color:var(--good);color:#04140a}
.btn[disabled]{opacity:.4;cursor:not-allowed}
.btn:focus-visible,.go:focus-visible,.chip:focus-visible,.nav button:focus-visible,.wb:focus-visible{outline:2px solid #fff;outline-offset:2px}

/* ---------- sheets and modals ---------- */
.sheet{position:absolute;left:0;right:0;bottom:var(--botH,124px);max-height:calc(100% - var(--botH,124px) - 96px - var(--sat));overflow:auto;background:linear-gradient(180deg,#111b30,#0b1220);border-top:1px solid #ffc94a66;padding:16px calc(16px + var(--sar)) 16px calc(16px + var(--sal));z-index:25;animation:up .22s ease-out;font-family:var(--body);box-shadow:0 -20px 60px #000a}
@keyframes up{from{transform:translateY(30px);opacity:0}}
.sheet .hd{display:flex;align-items:flex-start;gap:10px;margin-bottom:8px}
.sheet .hd .k{font:500 10px/1 var(--mono);letter-spacing:.18em;color:var(--accent);text-transform:uppercase}
.sheet .hd h3{margin:3px 0 0;font:700 21px/1.1 var(--display);letter-spacing:.03em}
.sheet .hd h3 small{font:700 12px var(--mono);color:#02141a;background:var(--ally);padding:2px 5px;margin-left:6px;vertical-align:3px}
.x{all:unset;cursor:pointer;margin-left:auto;width:40px;height:40px;display:grid;place-items:center;font-size:18px;color:#c9d4e6;border:1px solid #ffffff22;flex:none}
.sheet p{margin:0 0 10px;color:#b9c7dc;font-size:13.5px}
.sec{border-top:1px solid #ffffff14;padding-top:10px;margin-top:10px;display:grid;gap:8px}
.sec .h{font:500 10px/1 var(--mono);letter-spacing:.18em;color:#8f9bb3;text-transform:uppercase}
.kv{display:flex;justify-content:space-between;gap:10px;font-size:13.5px}
.kv b{font-weight:600;color:#fff}.kv .up{color:var(--good)}
.cost{display:flex;flex-wrap:wrap;gap:6px}
.cost span{display:flex;align-items:center;gap:6px;font:500 12px/1 var(--mono);background:#ffffff0d;padding:6px 8px}
.cost span.short{color:#ff9aa4;background:#ff4d5e1c}
.cost i{width:8px;height:8px;transform:rotate(45deg)}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.slider{display:grid;grid-template-columns:auto 1fr auto;gap:10px;align-items:center;font-size:13px}
.slider input{width:100%;accent-color:var(--accent);height:30px}
.slider output{font:500 13px var(--mono);min-width:44px;text-align:right}
.rs{display:grid;grid-template-columns:1fr auto;gap:8px;align-items:center;background:#ffffff08;border:1px solid #ffffff12;padding:10px}
.rs b{display:block;font:600 14px var(--display);letter-spacing:.03em}
.rs small{color:#8f9bb3;font-size:12px}
.note{font-size:12px;color:#8f9bb3}
.scrim{position:absolute;inset:0;background:#03050acc;display:grid;place-items:center;z-index:35;padding:18px;animation:tin .2s}
.modal{width:min(100%,400px);max-height:88%;overflow:auto;background:linear-gradient(180deg,#121d33,#0b1220);border:1px solid #ffffff2a;padding:18px;position:relative;font-family:var(--body)}
.modal h3{margin:0 0 6px;font:700 22px/1.1 var(--display)}
.modal p{margin:0 0 12px;color:#b9c7dc;font-size:14px}
.modal .x{position:absolute;right:10px;top:10px}
.adv{display:grid;grid-template-columns:52px 1fr;gap:12px;align-items:start}
.adv .face{width:52px;height:52px;background:#13213a;border:1px solid #4fe3ff77;display:grid;place-items:center}
.adv .face svg{width:38px;height:38px}
.adv .who{font:500 10px/1 var(--mono);letter-spacing:.18em;color:var(--ally);margin-bottom:5px}
.res-big{font:700 30px/1 var(--display);letter-spacing:.06em;margin:4px 0 10px}
.res-big.win{color:var(--good)}.res-big.loss{color:var(--foe)}
.tabs{display:grid;grid-template-columns:1fr 1fr;gap:6px;margin:4px 0 12px}
.tabs button{all:unset;cursor:pointer;text-align:center;padding:10px;font:600 12px var(--display);letter-spacing:.14em;border:1px solid #ffffff22;color:#9fb0cc}
.tabs button[aria-selected=true]{border-color:var(--accent);color:#fff1c9;background:#ffc94a14}
.ml{display:grid;gap:8px}
.mi{display:grid;grid-template-columns:1fr auto;gap:10px;align-items:center;background:#ffffff08;border:1px solid #ffffff12;padding:10px}
.mi.cur{border-color:#ffc94a77;background:#ffc94a0d}
.mi.dn{opacity:.5}
.mi b{font:600 13.5px var(--display);letter-spacing:.02em}
.mi small{display:block;color:#8f9bb3;font:500 11px/1.3 var(--mono);margin-top:2px}
.pbar{height:5px;background:#ffffff1a;margin-top:6px;position:relative}.pbar b{position:absolute;inset:0 auto 0 0;background:var(--accent)}
.hand{position:absolute;left:0;top:0;width:64px;height:64px;margin:-32px 0 0 -32px;border-radius:50%;border:2.5px solid var(--accent);animation:pt 1.2s ease-out infinite;will-change:transform}
.hand::after{content:"";position:absolute;left:38px;top:40px;width:26px;height:26px;background:var(--accent);clip-path:polygon(0 0,100% 55%,58% 62%,80% 100%,62% 100%,42% 66%,10% 92%);animation:tap 1.2s ease-in-out infinite;filter:drop-shadow(0 2px 3px #000)}
@keyframes pt{0%{box-shadow:0 0 0 0 #ffc94acc}100%{box-shadow:0 0 0 22px #ffc94a00}}
@keyframes tap{50%{transform:translate(-5px,-5px)}}
.ios{position:absolute;left:calc(10px + var(--sal));right:calc(10px + var(--sar));top:calc(96px + var(--sat));z-index:31;background:#0c1322f6;border:1px solid #4fe3ff77;padding:10px 12px;display:grid;grid-template-columns:1fr auto;gap:10px;align-items:center;font:500 13px/1.35 var(--body)}
.ios b{color:#bff6ff}
.ios svg{width:16px;height:16px;vertical-align:-3px}
.boot{position:absolute;inset:0;display:grid;place-items:center;background:#05070d;z-index:50;font:600 13px var(--display);letter-spacing:.3em;color:#8f9bb3;transition:opacity .6s}

/* ---------- opening tutorial ---------- */
#tut{position:absolute;inset:0;z-index:33;pointer-events:none;display:none}
#tut .tb{position:absolute;background:#02040acc;pointer-events:auto;touch-action:none}
#tut .tring{pointer-events:none}
#tut .tbub{position:absolute;left:calc(10px + var(--sal));right:calc(10px + var(--sar));top:calc(98px + var(--sat));display:grid;grid-template-columns:44px 1fr;gap:10px;align-items:start;background:#0c1322f6;border:1px solid #4fe3ff77;padding:10px 12px;pointer-events:auto;font:500 14px/1.4 var(--body);box-shadow:0 10px 30px #000a}
#tut .tbub.low{top:auto;bottom:calc(var(--botH,124px) + 10px)}

/* ================= v3 polish: one visual language for every control ================= */
:root{--cut:8px;--gold-hi:#ffe08a;--gold-lo:#e8a614;--panelG:linear-gradient(180deg,#15223d,#0c1426)}
body{font-size:15px}
.ico{width:18px;height:18px;flex:none;display:block}
.ico.big{width:34px;height:34px}.ico.t{width:16px;height:16px}
.chamf{clip-path:polygon(var(--cut) 0,100% 0,100% calc(100% - var(--cut)),calc(100% - var(--cut)) 100%,0 100%,0 var(--cut))}
/* buttons: bevel, press, chamfer */
.btn{min-height:48px;font:700 14px/1 var(--display);letter-spacing:.12em;border:none;background:linear-gradient(180deg,#22314f,#162238);box-shadow:inset 0 1px 0 #ffffff26,inset 0 -3px 0 #0006,inset 0 0 0 1px #ffffff1f;
  clip-path:polygon(var(--cut) 0,100% 0,100% calc(100% - var(--cut)),calc(100% - var(--cut)) 100%,0 100%,0 var(--cut));transition:transform .08s,filter .08s}
.btn.pri{background:linear-gradient(180deg,var(--gold-hi),#ffc23a 55%,var(--gold-lo));color:#2a1800;box-shadow:inset 0 1px 0 #fff8,inset 0 -3px 0 #a86f00;text-shadow:0 1px 0 #fff6}
.btn.grn{background:linear-gradient(180deg,#b6ffd2,#6cf2a2 55%,#33c776);color:#03210f;box-shadow:inset 0 1px 0 #fff8,inset 0 -3px 0 #1d8a4e}
.btn.big{min-height:54px;font-size:16px;width:100%}
.btn:active:not([disabled]),.go:active,.chip:active,.wb:active,.nav button:active,.mis:active{transform:scale(.96);filter:brightness(.92)}
.btn[disabled]{opacity:1;filter:grayscale(1) brightness(.55)}
.go{min-width:68px;height:44px;font-size:15px;letter-spacing:.12em;background:linear-gradient(180deg,var(--gold-hi),#ffc23a 55%,var(--gold-lo));color:#2a1800;box-shadow:inset 0 1px 0 #fff8,inset 0 -3px 0 #a86f00;
  clip-path:polygon(var(--cut) 0,100% 0,100% calc(100% - var(--cut)),calc(100% - var(--cut)) 100%,0 100%,0 var(--cut));transition:transform .08s}
.go.claim{background:linear-gradient(180deg,#b6ffd2,#6cf2a2 55%,#33c776);color:#03210f;box-shadow:inset 0 1px 0 #fff8,inset 0 -3px 0 #1d8a4e;animation:pulseS 1.1s ease-in-out infinite}
@keyframes pulseS{50%{transform:scale(1.06)}}
/* top bar */
.pow{background:linear-gradient(90deg,#101b31f2,#101b3199);border:none;box-shadow:inset 0 0 0 1px #ffffff1f;padding:5px 14px 5px 5px;clip-path:polygon(0 0,100% 0,calc(100% - 10px) 100%,0 100%)}
.ava{background:radial-gradient(circle at 50% 35%,#2a3f66,#101b31);border:1px solid #ffc94a88}
.pow .k{font-size:10px;letter-spacing:.2em;color:#c3cfe2}
.pow .v{font-size:21px}
.res{gap:5px}
.res span{gap:5px;padding:5px 6px;background:linear-gradient(180deg,#14203aee,#0c1426ee);border:none;box-shadow:inset 0 0 0 1px #ffffff17,inset 0 1px 0 #ffffff12;font:600 13px/1 var(--mono);transition:box-shadow .2s}
.res span b{font-weight:600;overflow:hidden;text-overflow:ellipsis}
.res span.pulse{box-shadow:inset 0 0 0 1px #ffffffaa,0 0 12px #ffffff44}
.res span.rise b{color:#d6ffe6}
.fly{width:22px;height:22px;transform:none;background:none!important;transition:transform .65s cubic-bezier(.5,-0.3,.6,1),opacity .65s}
.fly .ico{width:22px;height:22px;filter:drop-shadow(0 2px 4px #000)}
/* chips */
.chip{background:linear-gradient(90deg,#101b31f2,#0c1426e0);border:none;box-shadow:inset 0 0 0 1px #ffffff1c;border-left:3px solid var(--ally);font:500 12px/1.15 var(--mono);min-height:36px;padding:5px 8px 5px 9px}
.chip .free{font-size:11px;padding:7px 9px;clip-path:polygon(5px 0,100% 0,100% calc(100% - 5px),calc(100% - 5px) 100%,0 100%,0 5px)}
/* toasts */
.toast{display:flex;align-items:center;gap:8px;text-align:left;background:linear-gradient(180deg,#15223df5,#0c1426f5);border:none;box-shadow:inset 0 0 0 1px #ffffff26,0 8px 24px #0008;padding:9px 13px;font:500 13.5px/1.35 var(--body);
  clip-path:polygon(6px 0,100% 0,100% calc(100% - 6px),calc(100% - 6px) 100%,0 100%,0 6px);animation:tin .3s cubic-bezier(.2,1.4,.4,1)}
.toast.gold{box-shadow:inset 0 0 0 1px #ffc94a99,0 8px 24px #0008}.toast.warn{box-shadow:inset 0 0 0 1px #ff4d5e99,0 8px 24px #0008}

.toast .tk{font:600 10px var(--mono);letter-spacing:.16em;color:#ff8a96}
.toast .tw{width:18px;height:18px;flex:none;display:grid;place-items:center;background:var(--foe);color:#fff;font:700 12px var(--display);border-radius:50%}
@keyframes tin{from{opacity:0;transform:translateY(-10px) scale(.96)}}
/* mission banner */
.mis{grid-template-columns:40px 1fr auto;gap:11px;background:linear-gradient(90deg,#1a2a4ef2,#0e172cf2);border:none;box-shadow:inset 0 0 0 1px #ffffff22,inset 3px 0 0 var(--accent);padding:8px 8px 8px 11px;min-height:58px;
  clip-path:polygon(10px 0,100% 0,100% calc(100% - 10px),calc(100% - 10px) 100%,0 100%,0 10px);transition:transform .08s}
.mis .ic{width:40px;height:40px;font-size:16px;background:radial-gradient(circle at 50% 30%,#3a2a08,#1a1405);clip-path:polygon(50% 0,100% 25%,100% 75%,50% 100%,0 75%,0 25%);border:none}
.mis .k{font-size:10.5px;letter-spacing:.16em}
.mis .t{font-size:15px;line-height:1.2}
.mis .rw{display:flex;gap:10px;flex-wrap:wrap;margin-top:1px}
.rwi{display:inline-flex;align-items:center;gap:4px;font:600 12px/1 var(--mono);color:#e6efff}
.rwi .ico{width:15px;height:15px}
.rwl{display:flex;gap:10px;flex-wrap:wrap;margin-top:5px}
/* nav */
.nav button{font-size:11px;padding:7px 0 5px;border-top:none;transition:color .15s,transform .08s}
.nav button::before{content:"";position:absolute;left:18%;right:18%;top:0;height:3px;background:var(--accent);transform:scaleX(0);transition:transform .2s;box-shadow:0 0 10px var(--accent)}
.nav button[aria-current=true]{color:#fff;background:radial-gradient(60% 80% at 50% 0%,#ffc94a2a,transparent)}
.nav button[aria-current=true]::before{transform:scaleX(1)}
.nav button[aria-current=true] svg{stroke:#ffd76e}
/* sheets */
.sheet{background:linear-gradient(180deg,#15223d,#0b1220 120px);border-top:none;box-shadow:0 -1px 0 #ffc94a88,0 -24px 60px #000c;padding-top:22px;animation:sheetIn .34s cubic-bezier(.2,1.15,.35,1)}
@keyframes sheetIn{from{transform:translateY(60%);opacity:.3}}
.sheet .grab{position:absolute;left:50%;top:8px;width:40px;height:4px;margin-left:-20px;border-radius:2px;background:#ffffff33}
.sheet .hd{margin-bottom:10px}
.sheet .hd .k{font-size:11px}
.sheet .hd h3{font-size:23px}
.sheet p{font-size:15px;line-height:1.45;color:#c3cfe2}
.sec{gap:10px;padding-top:12px;margin-top:12px}
.sec .h{font-size:11px;color:#9fb0cc}
.kv{font-size:15px}
.cost span{gap:6px;padding:7px 9px;background:#ffffff0d;font:600 13px/1 var(--mono);clip-path:polygon(5px 0,100% 0,100% calc(100% - 5px),calc(100% - 5px) 100%,0 100%,0 5px)}
.cost span small{font:500 11px var(--mono);color:#8f9bb3}
.cost span.short{color:#ff9aa4;background:#ff4d5e22}
.cost span.short small{color:#ff9aa4aa}
.rs{padding:11px 12px;background:#ffffff09;border:none;box-shadow:inset 0 0 0 1px #ffffff14;clip-path:polygon(6px 0,100% 0,100% calc(100% - 6px),calc(100% - 6px) 100%,0 100%,0 6px)}
.rs.sp{grid-template-columns:auto 1fr auto;gap:12px}
.rs b{font-size:15px}.rs small{font-size:12.5px}
.note{font-size:13px}
.x{width:44px;height:44px;border:none;box-shadow:inset 0 0 0 1px #ffffff26;background:#ffffff08;border-radius:50%}
.slider{font-size:14px}.slider output{font-size:15px;font-weight:600;color:#fff}
.mi{padding:12px;background:#ffffff09;border:none;box-shadow:inset 0 0 0 1px #ffffff14;clip-path:polygon(6px 0,100% 0,100% calc(100% - 6px),calc(100% - 6px) 100%,0 100%,0 6px)}
.mi.cur{box-shadow:inset 0 0 0 1px #ffc94a88;background:#ffc94a10}
.mi b{font-size:15px}.mi small{font-size:12px}
/* modals */
.scrim{background:radial-gradient(80% 60% at 50% 45%,#0a1224cc,#020409ee);animation:tin .2s}
.modal{background:linear-gradient(180deg,#17264a,#0b1220 70%);border:none;box-shadow:inset 0 0 0 1px #ffffff2a,inset 0 1px 0 #ffffff33,0 30px 80px #000;padding:22px 20px 20px;
  clip-path:polygon(14px 0,100% 0,100% calc(100% - 14px),calc(100% - 14px) 100%,0 100%,0 14px);animation:mIn .38s cubic-bezier(.2,1.4,.4,1)}

.modal h3{font-size:24px}

.adv{display:block;text-align:center}

.adv.sm{display:grid;grid-template-columns:72px 1fr;gap:10px;text-align:left;align-items:center;margin-bottom:12px;padding-bottom:12px;border-bottom:1px solid #ffffff14}

.rwm .rays{position:absolute;left:50%;top:40%;width:420px;height:420px;margin:-210px 0 0 -210px;background:repeating-conic-gradient(#ffc94a14 0 10deg,transparent 10deg 20deg);border-radius:50%;mask:radial-gradient(closest-side,#000 30%,transparent);-webkit-mask:radial-gradient(closest-side,#000 30%,transparent);animation:spin 18s linear infinite;pointer-events:none;z-index:-1}

.modal .sec .tiles{margin:0}
.res-big{font-size:38px;text-align:center;text-shadow:0 0 24px currentColor}
/* level-up banner */
.lvb{position:absolute;left:0;right:0;top:34%;display:grid;justify-items:center;gap:4px;padding:14px 0 12px;background:linear-gradient(90deg,transparent,#0b1220ee 18%,#0b1220ee 82%,transparent);

/* ================= v4 quality pass (2026-11-10): HUD depth, type scale, labels for the rendered base ================= */
:root{--mono:"Chakra Petch",ui-sans-serif,system-ui,sans-serif;--r:12px}
.hud,.bl,.sheet,.modal,.toast,#tut{font-variant-numeric:tabular-nums}
/* scene framing: soft top and bottom bands so the HUD always sits on something, plus a light vignette */
#labels::after{content:"";position:absolute;inset:0;pointer-events:none;background:
  linear-gradient(180deg,#040912e6 0,#04091299 calc(60px + var(--sat)),#04091200 calc(150px + var(--sat))),
  linear-gradient(0deg,#040912f2 0,#040912b0 calc(var(--botH,124px) * .8),#04091200 calc(var(--botH,124px) + 70px)),
  radial-gradient(120% 85% at 50% 48%,#0000 58%,#03081266 100%)}
/* --- top bar --- */
.top{gap:8px;left:calc(8px + var(--sal));right:calc(8px + var(--sar));top:calc(6px + var(--sat))}
.pow{clip-path:none;border-radius:24px 12px 12px 24px;padding:3px 16px 3px 3px;gap:9px;background:linear-gradient(180deg,#1d2b4a,#0e1730);box-shadow:inset 0 1px 0 #ffffff33,inset 0 0 0 1px #ffffff1a,0 4px 12px #0009}
.ava{width:42px;height:42px;border-radius:50%;border:2px solid #ffc94a;background:radial-gradient(circle at 50% 30%,#3b5488,#101b31 70%);box-shadow:0 0 0 2px #0b1220,inset 0 -6px 10px #0006}
.ava svg{width:24px!important;height:24px!important;filter:drop-shadow(0 1px 2px #000)}
.pow .k{font:600 10px/1 var(--display);letter-spacing:.18em;color:#9fb6dc}
.pow .v{font-size:22px;line-height:1.05;color:#fff;text-shadow:0 1px 0 #0008}
.icb{width:44px;height:44px;border:none;border-radius:50%;background:linear-gradient(180deg,#1d2b4a,#0e1730);box-shadow:inset 0 1px 0 #ffffff33,inset 0 0 0 1px #ffffff1a,0 4px 12px #0009}
.icb svg{width:22px;height:22px}
.res{gap:6px}
.res span{position:relative;height:30px;border-radius:15px;padding:0 8px 0 30px;justify-content:flex-end;background:linear-gradient(180deg,#0a1224e8,#131f3ae8);box-shadow:inset 0 2px 4px #000a,inset 0 0 0 1px #ffffff1c,0 1px 0 #ffffff14;font:700 14px/1 var(--display);letter-spacing:.02em;color:#fff;overflow:visible}
.res span .ico{position:absolute;left:1px;top:50%;width:26px;height:26px;margin-top:-13px;filter:drop-shadow(0 2px 2px #000a)}
.res span b{font-weight:700}
.res span.pulse{box-shadow:inset 0 0 0 1.5px #ffffffcc,0 0 14px #ffffff66}
/* --- job chips --- */
.chips{top:calc(100px + var(--sat));gap:6px;left:calc(8px + var(--sal))}
.chip{border-left:none;border-radius:var(--r);padding:4px 10px 4px 4px;gap:8px;min-height:44px;background:linear-gradient(180deg,#1a2744f5,#0d1529f5);box-shadow:inset 0 1px 0 #ffffff2e,inset 0 0 0 1px #ffffff17,0 4px 10px #0008;font:500 12.5px/1.2 var(--display);color:#c6d3ea;letter-spacing:.02em}
.chip em{font-weight:600;color:#fff}
.chip .ci{width:36px;height:36px;border-radius:9px;display:grid;place-items:center;flex:none;background:linear-gradient(180deg,#2f78a6,#1b4a70);box-shadow:inset 0 1px 0 #ffffff55,inset 0 -2px 0 #0005}
.chip .ci svg{width:21px;height:21px;fill:none;stroke:#fff;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}
.chip.b .ci{background:linear-gradient(180deg,#f2b632,#b97a08)}.chip.w .ci{background:linear-gradient(180deg,#e8505f,#9c1e2d)}.chip.t .ci{background:linear-gradient(180deg,#4fcf8a,#1f8751)}
.chip.idle .ci{animation:nudge 2.4s ease-in-out infinite}

.chip .pg{height:5px;border-radius:3px;overflow:hidden;width:46px}
.toasts{top:calc(104px + var(--sat))}
.toast{border-radius:var(--r);clip-path:none}
/* --- mission banner + nav --- */
.bot{padding:0;gap:0;background:none}
.mis{margin:0 calc(8px + var(--sar)) 8px calc(8px + var(--sal));width:auto;clip-path:none;border-radius:14px;background:linear-gradient(180deg,#22335af7,#111a31f7);box-shadow:inset 0 1px 0 #ffffff38,inset 0 0 0 1px #ffffff1c,0 6px 16px #000a;padding:8px 8px 8px 10px;grid-template-columns:44px 1fr auto;min-height:62px}
.mis .ic{width:44px;height:44px;font-size:18px;color:#2a1800;background:linear-gradient(180deg,#ffe08a,#e8a614);box-shadow:inset 0 2px 0 #fff8;text-shadow:0 1px 0 #fff6}

function place(el,pos,cam,dy=0){proj.copy(pos).project(cam);const w=app.clientWidth,h=app.clientHeight;
  if(proj.z>1||proj.z<-1){el.style.visibility='hidden';return false;}
  const x=(proj.x+1)/2*w,y=(-proj.y+1)/2*h+dy;el.style.visibility='';el.style.transform=`translate(${x.toFixed(1)}px,${y.toFixed(1)}px) translate(-50%,-100%)`;return {x,y};}
function screenOf(pos,cam){proj.copy(pos).project(cam);return {x:(proj.x+1)/2*app.clientWidth,y:(-proj.y+1)/2*app.clientHeight,ok:proj.z<1};}

      float edge=smoothstep(1.2,0.0,abs(r-R))*0.5+smoothstep(0.08,0.0,abs(r-R))*0.5;float inside=smoothstep(R+0.6,R-0.6,r);

      vec3 c=col*a+vec3(1.0,0.79,0.29)*front*(0.07+0.03*sin(uT*2.0));

const planetVert=`varying vec3 vN;varying vec3 vO;varying vec3 vW;uniform float uSpin;
  void main(){float c=cos(uSpin),s=sin(uSpin);vO=vec3(c*position.x-s*position.z,position.y,s*position.x+c*position.z);
  vN=normalize(mat3(modelMatrix)*normal);vec4 w=modelMatrix*vec4(position,1.0);vW=w.xyz;gl_Position=projectionMatrix*viewMatrix*w;}`;
const planetFrag=NOISE+`varying vec3 vN;varying vec3 vO;varying vec3 vW;
  uniform vec3 cA,cB,cC,cD,uAtm,uStar;uniform float uSea,uCloud,uGas,uSeed,uT,uLava;
  void main(){vec3 p=normalize(vO)*1.6+uSeed;vec3 col;
    if(uGas>0.5){float w=fbm(p*1.2)*0.22;float b=sin((p.y+w)*9.0)+0.6*sin((p.y+w*1.6)*23.0);
      col=mix(cA,cB,smoothstep(-1.2,1.2,b));col=mix(col,cC,smoothstep(0.6,1.5,b+fbm(p*3.0)*0.3)*0.5);
      float storm=smoothstep(0.32,0.0,length((normalize(vO)-normalize(vec3(0.6,-0.25,0.75)))*vec3(1.0,1.8,1.0)));col=mix(col,cD,storm*0.85);}
    else{float h=fbm(p)+0.35*fbm(p*4.0);
      if(h<uSea){col=mix(cA,cB,smoothstep(uSea-0.5,uSea,h));}
      else{float t=smoothstep(uSea,uSea+0.7,h);col=mix(cC,cD,t);col*=0.85+0.3*fbm(p*9.0);}
      if(uLava>0.5){float cr=smoothstep(0.06,0.0,abs(fbm(p*2.5+3.0)));col=mix(col,vec3(1.0,0.45,0.1)*1.8,cr);}
      float lat=abs(normalize(vO).y);col=mix(col,vec3(0.92,0.96,1.0),smoothstep(0.93,0.97,lat+fbm(p*3.0)*0.05)*step(0.5,1.0-uLava));}
    if(uCloud>0.0){float cl=smoothstep(0.05,0.5,fbm(p*1.7+vec3(uT*0.02,0.0,0.0)+fbm(p*3.0)*0.5));col=mix(col,vec3(0.97,0.98,1.0),cl*uCloud);}
    vec3 N=normalize(vN);vec3 L=normalize(uStar-vW);vec3 V=normalize(cameraPosition-vW);
    float d=dot(N,L);float lit=smoothstep(-0.25,0.6,d);
    vec3 night=col*0.3+uAtm*0.07;
    if(uLava>0.5){night+=vec3(1.0,0.4,0.1)*smoothstep(0.06,0.0,abs(fbm(p*2.5+3.0)))*0.9;}
    vec3 c=mix(night,col*1.12,lit);
    float spec=pow(max(dot(reflect(-L,N),V),0.0),24.0)*step(fbm(p)+0.35*fbm(p*4.0),uSea)*(1.0-uGas);c+=vec3(1.0,0.9,0.75)*spec*0.6*lit;
    float fr=pow(1.0-max(dot(N,V),0.0),2.6);c+=uAtm*fr*(0.35+0.9*smoothstep(-0.4,0.6,d));
    gl_FragColor=vec4(c,1.0);}`;

const bc={t:V3(PLOTS.cc.x,0,PLOTS.cc.z+1.5),zoom:0,vel:V3(),goal:null,pitch:BPITCH,zmin:14,zmax:40};// zoom = CSS pixels per world unit
function baseView(){const W=app.clientWidth||390,H=app.clientHeight||844;return{W,H};}
function baseZoomLimits(){const {W,H}=baseView();bc.zmin=Math.max(W/(PW-1),H/(PH-1));bc.zmax=42;bc.zdef=clamp(Math.min(W,H*.7)/15.5,bc.zmin,bc.zmax);if(!bc.zoom)bc.zoom=bc.zdef;}
/* aim the camera so a plot sits in the clear part of the screen (above an open sheet) */
function bcFocus(k,frac=.36){const p=PLOTS[k],{W,H}=baseView();const land=W>H*1.05;const off=land?0:(.5-frac)*H/bc.zoom/SINP;
  return V3(p.x,0,p.z).addScaledVector(BG,off).addScaledVector(BR,land?W*.22/bc.zoom:0);}
function baseCamUpdate(dt){baseZoomLimits();const {W,H}=baseView();
  if(bc.goal){bc.t.lerp(bc.goal,Math.min(1,dt*5));if(bc.t.distanceTo(bc.goal)<.02)bc.goal=null;}
  else if(bc.vel.lengthSq()>1e-6){bc.t.addScaledVector(bc.vel,dt);bc.vel.multiplyScalar(Math.exp(-dt*5));}
  bc.zoom=clamp(bc.zoom,bc.zmin,bc.zmax);
  const vw=W/bc.zoom,vh=H/bc.zoom;const s=bc.t.clone().sub(BT0);let cx=s.dot(BR),cy=-s.dot(BG)*SINP;
  const mx=Math.max(0,Math.min(PW/2-vw/2-.2,19)),my=Math.max(0,Math.min(PH/2-vh/2-.2,17));
  cx=clamp(cx,-mx,mx);cy=clamp(cy,-my,my);bc.t.copy(BT0).addScaledVector(BR,cx).addScaledVector(BG,-cy/SINP);
  bcam.left=-vw/2;bcam.right=vw/2;bcam.top=vh/2;bcam.bottom=-vh/2;bcam.updateProjectionMatrix();
  bcam.position.copy(bc.t).addScaledVector(BD,200);bcam.updateMatrixWorld();}
/* drag by screen pixels */
function basePan(dx,dy){const mx=-dx/bc.zoom,mz=-dy/bc.zoom/SINP;const v=BR.clone().multiplyScalar(mx).addScaledVector(BG,mz);bc.t.add(v);return v;}

const DROIDS={rivet:{n:'Rivets',ty:'inf',atk:14,hp:30},bulwark:{n:'Bulwarks',ty:'inf',atk:10,hp:70},stomper:{n:'Stompers',ty:'armor',atk:30,hp:75},lobber:{n:'Lobbers',ty:'art',atk:34,hp:30},gnat:{n:'Gnat Swarms',ty:'air',atk:22,hp:22}};
const mult=(a,d)=>BEATS[a]===d?1.3:BEATS[d]===a?0.77:1;
const RES=[['alloy','#c9d4e6','Alloy'],['fuel','#ff9b4a','Fuel'],['credits','#ffc94a','Credits'],['medals','#7dffb0','Medals']];

const SP=[['1m',60],['5m',300],['10m',600],['15m',900],['30m',1800],['1h',3600],['2h',7200],['4h',14400],['6h',21600],['8h',28800],['12h',43200],['1d',86400],['3d',259200],['7d',604800]];
const SPS=Object.fromEntries(SP);
const FREE=300;// builds and research under 5:00 finish free
const KO=0.17,KD=0.12;

const TT=[0,0,20,60,180,480,1200,2700,5400,10800,21600];// seconds to reach level n

  hub:{n:'Trade Hub',d:'Produces Credits, used for research and upgrades.',cost:{alloy:140,fuel:60},needCC:2,prod:'credits',rate:.5},
  barracks:{n:'Barracks',d:'Trains Infantry. Higher levels train bigger batches, faster.',cost:{alloy:130,fuel:80},trains:'inf'},
  hangar:{n:'Hangar',d:'Trains Air units. Air beats Armor.',cost:{alloy:160,fuel:90},needCC:3,trains:'air'},
  lab:{n:'Research Lab',d:'Runs research that makes everything stronger.',cost:{alloy:150,credits:90},needCC:2},
  hospital:{n:'Field Hospital',d:'Wounded troops come here instead of dying. Heal them to get them back.',cost:{alloy:120,fuel:60},needCC:2},
  uplink:{n:'Orbital Uplink',d:'Controls your Orbital Platform: the gun in orbit that supports your battles.',cost:{alloy:300,credits:160},needCC:3,tm:.8,t1:20},
  comms:{n:'Listening Post',d:'Listens in on droid communications. Some of it is useful. Some of it is just droids.',cost:{alloy:150,credits:80},needCC:3},
  bay:{n:'Vehicle Bay',d:'Trains Armor. Armor beats Artillery.',cost:{alloy:400,fuel:200},needCC:4,trains:'armor'},
  works:{n:'Artillery Works',d:'Trains Artillery. Artillery beats Infantry.',cost:{alloy:400,fuel:240},needCC:4,trains:'art'},
};
const costOf=(k,l)=>{const c={};Object.entries(BDEF[k].cost).forEach(([r,v])=>c[r]=Math.round(v*Math.pow(1.85,Math.max(0,l-2))/10)*10);return c;};
const timeOf=(k,l)=>l===1?(BDEF[k].t1||8):Math.round((TT[l]||TT[TT.length-1]*2)*(BDEF[k].tm||1));

const capOf=(k,l)=>800*l;
const RESEARCH=[
  {k:'atk',n:'Hardened Rounds',d:'+10% attack for all troops',cost:{credits:250},t:45},
  {k:'march',n:'Jump Calibration',d:'Armies travel 20% faster',cost:{credits:400},t:150},
  {k:'barrage',n:'Dense Barrage',d:'Barrage hits 30% harder',cost:{credits:500,alloy:300},t:420},
  {k:'shield',n:'Wide Shield',d:'Shield covers 30% more ground',cost:{credits:500,fuel:300},t:420},
];
const WEAP={barrage:{n:'Barrage',cd:20,rad:.36,svg:'<path d="M12 2v13M8 11l4 4 4-4M5 20h14"/>'},shield:{n:'Shield',cd:32,rad:.42,rounds:3,svg:'<path d="M12 3l7 4v5c0 4-3 7-7 9-4-2-7-5-7-9V7z"/>'}};

const MIX={'KESTREL II':{rivet:.62,gnat:.26,bulwark:.12},'KESTREL IV':{rivet:.45,bulwark:.15,stomper:.15,lobber:.1,gnat:.15},'KESTREL VI':{gnat:.5,rivet:.3,lobber:.2},'VARN':{stomper:.4,rivet:.4,bulwark:.2},'MYRE':{lobber:.35,rivet:.45,gnat:.2}};
const CHATTER=['Relay 9 to Command: requesting clarification on "hold the line." Which line. There are several lines.',
 'Depot 4: shipment of left legs received. Awaiting right legs. Morale is uneven.',
 'Patrol 12: sensor reports an enemy in range. Sensor also identifies itself as the enemy. Sensor has been reassigned.',
 'Command, all units: retreat is forbidden. Advancing backwards is under review.',
 'Unit 22: I have located the target. The target has located me. Requesting a tie-breaker.',

/* ---------- state ---------- */
const SAVE='stardiver-v3';
function fresh(){return{v:3,G:0,savedAt:Date.now(),tut:0,res:{alloy:1200,fuel:900,credits:700,medals:0},
  b:{cc:1,refinery:0,extractor:0,hub:0,barracks:1,hangar:0,lab:0,hospital:0,uplink:0,comms:1,bay:0,works:0},comms:{next:0,log:[],n:0},
  store:{},build:null,train:{},research:null,done:{},
  troops:{inf:0,air:0,armor:0,art:0},wounded:{inf:0,air:0,armor:0,art:0},heal:null,items:{'1m':3,'5m':1},
  ctrl:{'KESTREL II':40,'KESTREL IV':62},plat:null,mi:0,claimed:false,st:{},daily:{day:-1,base:{},got:{}},seenIntro:false,iosHint:false,cd:{}};}
let S;try{S=JSON.parse(localStorage.getItem(SAVE)||'null');}catch(e){S=null;}
if(!S||S.v!==3)S=fresh();
let offline=0;
{const away=Math.max(0,(Date.now()-(S.savedAt||Date.now()))/1000);offline=away;S.G+=away;}
const st=k=>S.st[k]||0;

/* ---------- economy ---------- */
const canPay=c=>Object.entries(c).every(([k,v])=>(S.res[k]||0)>=v);
function pay(c){Object.entries(c).forEach(([k,v])=>S.res[k]-=v);renderTop();}
function give(rw,from){const out=[];Object.entries(rw).forEach(([k,v])=>{if(k.startsWith('sp:')){const s=k.slice(3);S.items[s]=(S.items[s]||0)+v;out.push(`${v}× ${s} speed-up`);}else{S.res[k]=(S.res[k]||0)+v;out.push(`${nf(v)} ${k[0].toUpperCase()+k.slice(1)}`);if(from)flyRes(k,from);}});renderTop();return out.join(', ');}
function rwText(rw){return Object.entries(rw).map(([k,v])=>k.startsWith('sp:')?`${v}× ${k.slice(3)} speed-up`:`${nf(v)} ${k[0].toUpperCase()+k.slice(1)}`).join(' · ');}
function power(){let p=0;const add=tr=>TYPES.forEach(t=>p+=(tr[t]||0)*OURS[t].pow);add(S.troops);armies.forEach(a=>add(a.troops));battles.forEach(b=>add(b.ours));
  Object.values(S.b).forEach(l=>p+=l*l*40);p+=Object.keys(S.done).length*300;return Math.round(p);}
/* production collects automatically (Bridger, economy thread). store[] only feeds the little +N pops over each building */
function prodTick(dt){['refinery','extractor','hub'].forEach(k=>{const l=S.b[k];if(!l)return;const v=rateOf(k,l)*dt;S.res[BDEF[k].prod]+=v;S.store[k]=(S.store[k]||0)+v;});}
function popProd(k){const v=Math.floor(S.store[k]||0);if(v<1)return;S.store[k]-=v;const r=BDEF[k].prod;const p=plots[k];
  if(tab!=='base'||!p)return;const sc=screenOf(V3(p.x,p.h+.3,p.z),bcam);if(sc.ok)ftext(`+${nf(v)}`,sc,RESC[r]);}

/* ---------- buildings ---------- */
function canUpgrade(k){const l=S.b[k],n=l+1,d=BDEF[k];
  if(S.build)return{ok:false,why:'Your builder is busy. One build at a time.'};
  if(k!=='cc'&&n>S.b.cc)return{ok:false,why:`Upgrade the Command Center to Lv ${n} first.`};
  if(d.needCC&&S.b.cc<d.needCC)return{ok:false,why:`Needs Command Center Lv ${d.needCC}.`};
  if(n>10)return{ok:false,why:'Max level in this prototype.'};
  if(!canPay(costOf(k,n)))return{ok:false,why:'Not enough resources. Your buildings keep producing, and droid patrols drop loot.'};
  return{ok:true};}
function startUpgrade(k){const c=canUpgrade(k);if(!c.ok){toast(c.why,'warn');return false;}const n=S.b[k]+1;pay(costOf(k,n));
  S.build={k,to:n,start:S.G,end:S.G+timeOf(k,n)};stat('ups');refreshPlot(k);renderChips();return true;}
function finishBuild(){const bd=S.build;if(!bd)return;S.b[bd.k]=bd.to;S.build=null;refreshPlot(bd.k,true);
  if(bd.k==='uplink'&&bd.to===1)launchPlatform();
  levelBanner(BDEF[bd.k].n,bd.to);if(bd.k==='cc'&&CC_GIFT[bd.to]&&!tutOn()){const g=CC_GIFT[bd.to];setTimeout(()=>{give(g);rewardModal('COMMAND CENTER LV '+bd.to,'Level-up supplies',g);},1300);}else if(bd.k==='cc'&&CC_GIFT[bd.to]){give(CC_GIFT[bd.to]);}renderTop();renderChips();afterStat();if(sheetFor===bd.k)openPlot(bd.k);}
const CC_GIFT={2:{alloy:400,credits:200},3:{alloy:800,fuel:500,'sp:5m':1},4:{alloy:1500,fuel:1000,credits:600,'sp:15m':1},5:{alloy:3000,fuel:2000,'sp:1h':1}};
function freeFinish(){if(S.build&&S.build.end-S.G<=FREE){S.build.end=S.G;stat('free');finishBuild();}}
function useSpeed(kind,code){const job=kind==='build'?S.build:kind==='research'?S.research:S.train[kind];if(!job||!S.items[code])return;
  S.items[code]--;job.end-=SPS[code];toast(`Used a ${code} speed-up.`);stat('speedups');
  if(job.end<=S.G){job.end=S.G;}tickTimers();renderChips();}

/* ---------- training, research, hospital ---------- */
function trainMax(k){return 100*S.b[k]+50;}
function trainCost(t,n){return{alloy:OURS[t].alloy*n,fuel:OURS[t].fuel*n};}
function trainTime(k,t,n){if(tutOn()&&TUT[S.tut].train)return 60;// the tutorial batch takes a minute so the speed-up step means something
  return Math.round(n*OURS[t].t/(1+.15*(S.b[k]-1)));}
function startTrain(k,n){const t=BDEF[k].trains;if(S.train[k]){toast('Already training here.','warn');return;}const c=trainCost(t,n);if(!canPay(c)){toast('Not enough resources.','warn');return;}
  pay(c);S.train[k]={t,n,start:S.G,end:S.G+trainTime(k,t,n)};refreshPlot(k);renderChips();closeSheet();toast(`Training ${n} ${TN[t]}.`);}
function troopsDone(k){const q=S.train[k];if(!q)return;S.troops[q.t]+=q.n;delete S.train[k];const p=plots[k];
  if(tab==='base'){const sc=screenOf(V3(p.x,p.h+.6,p.z),bcam);ftext(`+${q.n} ${TN[q.t]}`,sc,'#7dffb0');}
  toast(`${q.n} ${TN[q.t]} trained and ready.`);stat('trained',q.n);refreshPlot(k);renderTop();renderChips();}
function startResearch(r){if(S.research){toast('The lab is already researching.','warn');return;}if(!canPay(r.cost)){toast('Not enough resources.','warn');return;}
  pay(r.cost);S.research={k:r.k,n:r.n,start:S.G,end:S.G+r.t};stat('research');refreshPlot('lab');renderChips();openPlot('lab');}
function freeResearch(){if(S.research&&S.research.end-S.G<=FREE){S.research.end=S.G;tickTimers();}}
function healAll(){const n=TYPES.reduce((s,t)=>s+S.wounded[t],0);if(!n)return;const c={fuel:Math.ceil(n*.5)};if(!canPay(c)){toast('Not enough Fuel.','warn');return;}pay(c);
  S.heal={tr:{...S.wounded},start:S.G,end:S.G+Math.max(5,Math.round(n*.08))};TYPES.forEach(t=>S.wounded[t]=0);renderChips();closeSheet();toast(`Healing ${nf(n)} troops.`);}
function tickTimers(){
  if(S.build&&S.G>=S.build.end)finishBuild();
  Object.entries(S.train).forEach(([k,q])=>{if(S.G>=q.end)troopsDone(k);});
  if(S.research&&S.G>=S.research.end){S.done[S.research.k]=1;toast(`Research done: ${S.research.n}.`,'gold');S.research=null;refreshPlot('lab');renderChips();renderTop();afterStat();}
  if(S.heal&&S.G>=S.heal.end){TYPES.forEach(t=>S.troops[t]+=S.heal.tr[t]);toast('Healed troops are back on duty.');S.heal=null;renderChips();renderTop();}}
/* Listening Post: intercepts arrive over time. Some are just droids talking; some reveal a bonus target. */
const POI_KINDS=[{name:'Droid Supply Convoy',msg:n=>`Convoy 3 to Depot: hauling ${n} crates of parts through the lane. Please do not tell anyone where we are. Location attached.`},
  {name:'Droid Relay Outpost',msg:()=>'Relay Outpost: our position is secret. Broadcasting our position so everyone knows it is secret.'},
  {name:'Droid Scrap Barge',msg:()=>'Scrap Barge: full of salvage, lightly guarded, very slow. Reminder: do not mention we are lightly guarded.'}];
function commsTick(){const l=S.b.comms;if(!l||S.tut<TUT_COMMS)return;const C=S.comms;if(!C.next){C.next=S.G+25;return;}if(S.G<C.next)return;
  C.n++;const poiRoll=C.n===1||Math.random()<.4;const id=C.n;
  if(poiRoll&&!patrols.some(p=>p.poi)){const k=pick(POI_KINDS);const n=Math.round(rand(160,240));const poi={name:k.name,n,spot:(C.n-1)%POI_SPOTS.length,exp:S.G+600,done:false};
    C.log.unshift({id,txt:k.msg(n),poi,read:false});spawnPatrol(-1,poi);toast('Listening Post intercepted a droid transmission with a location.','gold');}
  else{C.log.unshift({id,txt:pick(CHATTER),read:false});}
  C.log=C.log.slice(0,12);C.next=S.G+75/(1+.25*(l-1));refreshPlot('comms');}
function commsExpire(){patrols.filter(p=>p.poi&&(S.G>p.poi.exp)&&!p.busy).forEach(p=>{p.poi.done=true;despawn(p);});}
const unread=()=>S.comms.log.filter(m=>!m.read).length;
S.comms.log.forEach(m=>{if(m.poi&&!m.poi.done&&m.poi.exp>S.G)spawnPatrol(-1,m.poi);});
const atkMul=()=>1+(S.done.atk?.1:0);

/* =====================================================================
   STAR MAP RULES: armies, planet battles, patrols, the platform
   ===================================================================== */
const armies=[],battles=[];
planets.forEach(p=>{p.ctrl=S.ctrl[p.name]??(p.side==='ally'?100:p.side==='neu'?null:0);p.diff=DIFF[p.name]||0;});
function sideOf(p){return p.ctrl==null?'neu':p.ctrl>=100?'ally':p.ctrl<=0?'foe':'war';}
function refreshPlanet(p){p.side=sideOf(p);p.el.className='pl '+p.side+(selP===p?' sel':'');
  p.el.innerHTML=(p.home?'<span class="base"><span>⌂</span></span>':'')+`<span class="n">${p.name}</span><span class="f">${p.home?'YOUR BASE':p.side==='war'?Math.round(p.ctrl)+'% HELD':p.side==='ally'?'CONCORD':p.side==='foe'?'ASSEMBLY':'UNCLAIMED'}</span><span class="mini"><i style="width:${p.ctrl||0}%"></i></span>`;}
let selP=null;
const slots=()=>S.b.cc>=5?3:2;
const busy=()=>armies.length+battles.length;
function marchTime(A,B){return (6+A.distanceTo(B)*0.24)*(S.done.march?.8:1);}
function sendArmy(target,tr){const tot=TYPES.reduce((s,t)=>s+tr[t],0);if(!tot){toast('Pick some troops to send.','warn');return false;}
  if(busy()>=slots()){toast(`All ${slots()} army slots are busy.`,'warn');return false;}
  const A=home.group.position,B=target.pos();const fuel=Math.round(20+A.distanceTo(B)*3);if(S.res.fuel<fuel){toast(`Not enough Fuel (needs ${fuel}).`,'warn');return false;}
  S.res.fuel-=fuel;TYPES.forEach(t=>S.troops[t]-=tr[t]);
  const g=makeFleet();const el=document.createElement('div');el.className='mk army';LM.appendChild(el);
  const trail=[];for(let i=0;i<14;i++){const s=sprite(SOFT,0x4fe3ff,0.4,0);mscene.add(s);trail.push(s);}
  armies.push({target,troops:tr,t0:S.G,dur:marchTime(A,B),dir:'out',g,el,trail});
  if(target.planet)stat('attacks');renderTop();renderChips();return true;}
function makeFleet(){const g=new THREE.Group();g.add(allyCruiser());[[0.32,-0.3],[-0.32,-0.3],[0.0,-0.62]].forEach(([x,z])=>{const f=allyFrigate();f.scale.setScalar(1.25);f.position.set(x,0.04,z);g.add(f);});g.scale.setScalar(.65);mscene.add(g);return g;}
function endMarch(a){mscene.remove(a.g);a.trail.forEach(s=>mscene.remove(s));a.el.remove();armies.splice(armies.indexOf(a),1);
  if(a.dir==='back'){TYPES.forEach(t=>S.troops[t]+=a.troops[t]);toast(`Army home with ${nf(TYPES.reduce((s,t)=>s+a.troops[t],0))} troops.`);renderTop();}
  else if(a.target.planet)startBattle(a.target.planet,a.troops);
  else patrolFight(a.target.patrol,a.troops);
  renderChips();}
function returnHome(from,troops){const A=from.clone(),g=makeFleet();const el=document.createElement('div');el.className='mk army';LM.appendChild(el);
  const trail=[];for(let i=0;i<14;i++){const s=sprite(SOFT,0x4fe3ff,0.4,0);mscene.add(s);trail.push(s);}
  armies.push({target:{pos:()=>home.group.position,r:home.r,name:'HALCYON'},from:A,troops,t0:S.G,dur:marchTime(A,home.group.position)*.7,dir:'back',g,el,trail});}

/* planet battles: droids arrive in columns that advance on your landing zone */
function waveFor(p){const n=Math.round(420*p.diff*rand(.92,1.08));const mix=MIX[p.name]||{rivet:.5,bulwark:.2,gnat:.3};return Object.entries(mix).map(([k,f])=>({k,n:Math.round(n*f)}));}
function startBattle(p,troops){
  const lz=V3(0.12,0.62,0.78).normalize();const perp=lz.clone().cross(V3(0,1,0)).normalize();
  const wave=waveFor(p);const off=rand(0,TAU);
  const cols=wave.map((w,i)=>{const ax=perp.clone().applyAxisAngle(lz,off+i*TAU/wave.length);const dir=lz.clone().applyAxisAngle(ax,rand(.75,.95));return{...w,n0:w.n,dir,fx:[],el:null};});
  const b={planet:p,ours:{...troops},ours0:{...troops},lost:{inf:0,air:0,armor:0,art:0},cols,lz,round:0,rounds:12,next:S.G+3.5,shield:null,kills:0,ships:[],lzfx:[]};
  // visuals: our ships, droid ships, ground fire
  const yours={n:'Concord Frigate',w:'Your army',d:`Your troops' escort. Bombarding the droid columns on ${p.name}.`};
  for(let i=0;i<4;i++)b.ships.push(orbiter(allyFrigate(),p,{rad:1.5+Math.random()*.8,inc:(Math.random()-.5)*.8,node:Math.random()*TAU,sp:.2+Math.random()*.1,scale:.6,info:yours}));
  b.ships.push(orbiter(allyCruiser(),p,{rad:2.1,inc:.2,node:1,sp:.08,scale:.5,info:{...yours,n:'Concord Cruiser'}}));
  b.foes=[];for(let i=0;i<4;i++){const s=orbiter(foeRaider(),p,{foe:true,rad:1.25+Math.random()*.4,inc:(Math.random()-.5),node:Math.random()*TAU,sp:-(.22+Math.random()*.1),scale:.65});b.foes.push(s);b.ships.push(s);}
  cols.forEach(c=>{for(let i=0;i<7;i++){const s=sprite(GLOW,0xff4d5e,.12,.9);mscene.add(s);c.fx.push({s,o:V3(rand(-1,1),rand(-1,1),rand(-1,1)).multiplyScalar(.1)});}
    c.el=document.createElement('div');c.el.className='mk drd';LM.appendChild(c.el);});
  for(let i=0;i<6;i++){const s=sprite(GLOW,0x4fe3ff,.14,.9);mscene.add(s);b.lzfx.push({s,o:V3(rand(-1,1),rand(-1,1),rand(-1,1)).multiplyScalar(.07)});}
  b.lzel=document.createElement('div');b.lzel.className='mk lz';b.lzel.textContent='YOUR LANDING ZONE';LM.appendChild(b.lzel);
  battles.push(b);toast(`Battle for ${p.name} has started. Your Orbital Platform can support it.`,'gold');
  renderChips();renderWeap();}
const dsum=b=>b.cols.reduce((s,c)=>s+c.n,0),osum=tr=>TYPES.reduce((s,t)=>s+(tr[t]||0),0);
function battleRound(b,instant){
  const N=Math.max(1,dsum(b)),O=Math.max(1,osum(b.ours));
  b.cols.forEach(c=>{if(c.n<=0)return;let dmg=0;TYPES.forEach(t=>dmg+=b.ours[t]*OURS[t].atk*mult(t,DROIDS[c.k].ty));dmg*=(c.n/N)*atkMul();const k=Math.min(c.n,dmg*KO/DROIDS[c.k].hp);c.n-=k;b.kills+=k;});
  let dd=0;b.cols.forEach(c=>{const w=instant?1:.55+.45*clamp(1-c.dir.angleTo(b.lz)/1.0,0,1);dd+=c.n*DROIDS[c.k].atk*w;});
  if(b.shield&&b.round<b.shield.until)dd*=1-.6*b.shield.cov;
  dd*=KD;
  TYPES.forEach(t=>{if(!b.ours[t])return;let w=0,tot=0;b.cols.forEach(c=>{tot+=c.n;w+=c.n*mult(c.k&&DROIDS[c.k].ty,t);});const m=tot?w/tot:1;const loss=Math.min(b.ours[t],dd*(b.ours[t]/O)*m/OURS[t].hp);b.ours[t]-=loss;b.lost[t]+=loss;});
  if(!instant)b.cols.forEach(c=>{c.dir.lerp(b.lz,.07).normalize();});
  b.round++;
  const dl=dsum(b)/b.cols.reduce((s,c)=>s+c.n0,0),ol=osum(b.ours)/osum(b.ours0);
  if(dl<.04||ol<.05||b.round>=b.rounds)return{done:true,win:dl<ol};return{done:false};}

  const p=b.planet;const before=p.ctrl;
  if(win)p.ctrl=Math.min(100,p.ctrl+6/Math.sqrt(p.diff));else p.ctrl=Math.min(100,p.ctrl+.4);S.ctrl[p.name]=p.ctrl;refreshPlanet(p);
  const lost={},wnd={};TYPES.forEach(t=>{const L=Math.round(b.lost[t]);wnd[t]=Math.round(L*.35);lost[t]=L-wnd[t];S.wounded[t]+=wnd[t];});
  const surv={};TYPES.forEach(t=>surv[t]=Math.round(b.ours[t]));
  const kills=Math.round(b.kills);const rw=win?{alloy:Math.round(kills*2.4),fuel:Math.round(kills*1.6),medals:Math.round(30+kills*.15)}:{alloy:Math.round(kills*.8)};

function patrolFight(pt,troops){const mixes=[['rivet',.6],['gnat',.4]];const b={ours:{...troops},ours0:{...troops},lost:{inf:0,air:0,armor:0,art:0},cols:mixes.map(([k,f])=>({k,n:pt.n*f,n0:pt.n*f})),lz:V3(0,1,0),round:0,rounds:10,kills:0};

  if(ptrs.size===2){const [a,b]=[...ptrs.values()];pinch0=Math.hypot(a.x-b.x,a.y-b.y);zoom0=tab==='base'?bc.zoom:mc.dist;}});
canvas.addEventListener('pointermove',e=>{const p=ptrs.get(e.pointerId);if(!p)return;const dx=e.clientX-p.x,dy=e.clientY-p.y;p.x=e.clientX;p.y=e.clientY;if(down)down.moved+=Math.abs(dx)+Math.abs(dy);
  const H=app.clientHeight;
  if(ptrs.size===1){if(tab==='base'){bc.vel.copy(basePan(dx,dy)).multiplyScalar(50);}
    else{const d=mc.dist*(mcam.aspect<1?1.55:1);const wpp=2*d*Math.tan(mcam.fov*Math.PI/360)/H;const mx=-dx*wpp,mz=-dy*wpp/Math.sin(TILT);mc.t.x+=mx;mc.t.z+=mz;mc.vel.set(mx,0,mz).multiplyScalar(50);}}
  else if(ptrs.size===2&&pinch0>0){const [a,b]=[...ptrs.values()];const d=Math.hypot(a.x-b.x,a.y-b.y);if(tab==='base')bc.zoom=clamp(zoom0*d/pinch0,bc.zmin,bc.zmax);else mc.dist=clamp(zoom0*pinch0/d,3,70);}});
const upP=e=>{const tap=down&&down.moved<9&&ptrs.size===1;ptrs.delete(e.pointerId);pinch0=0;if(tap){bc.vel.set(0,0,0);mc.vel.set(0,0,0);tapAt(e.clientX,e.clientY);}if(!ptrs.size)down=null;};
canvas.addEventListener('pointerup',upP);canvas.addEventListener('pointercancel',e=>{ptrs.delete(e.pointerId);down=null;});
canvas.addEventListener('wheel',e=>{e.preventDefault();if(tab==='base')bc.zoom=clamp(bc.zoom*Math.exp(-e.deltaY*.0012),bc.zmin,bc.zmax);else mc.goal={d:clamp((mc.goal&&mc.goal.d||mc.dist)*Math.exp(e.deltaY*.0015),3,70)};},{passive:false});
function tapAt(cx,cy){const a=app.getBoundingClientRect();ndc.set((cx-a.left)/a.width*2-1,-((cy-a.top)/a.height)*2+1);
  if(tab==='base'){ray.setFromCamera(ndc,bcam);const hit=V3();if(!ray.ray.intersectPlane(new THREE.Plane(V3(0,1,0),0),hit))return;
    let best=null,bd=1e9;Object.values(plots).forEach(o=>{const d=Math.hypot(hit.x-o.x,hit.z-o.z);if(d<o.r*1.25&&d<bd){bd=d;best=o;}});
    // tall buildings: also test the screen distance to their middle
    if(!best)Object.values(plots).forEach(o=>{const s=screenOf(V3(o.x,o.h*.5,o.z),bcam);const d=Math.hypot(s.x-(cx-a.left),s.y-(cy-a.top));if(d<44&&d<bd){bd=d;best=o;}});
    if(best)openPlot(best.k);else closeSheet();return;}
  ray.setFromCamera(ndc,mcam);
  if(aim){const p=aim.b.planet;const hit=V3();if(ray.ray.intersectSphere(new THREE.Sphere(p.group.position,p.r*1.02),hit)){aimAt(hit.sub(p.group.position).normalize());}return;}
  const x=cx-a.left,y=cy-a.top;let best=null,bd=1e9;
  ships.forEach(sh=>{const s=screenOf(sh.g.position,mcam);const d=Math.hypot(s.x-x,s.y-y);if(s.ok&&d<24&&d<bd){bd=d;best={sh};}});
  if(best){openShip(best.sh);return;}
  patrols.forEach(pt=>{const s=screenOf(pt.pos(),mcam);const d=Math.hypot(s.x-x,s.y-y);if(d<40&&d<bd){bd=d;best={pt};}});
  planets.forEach(p=>{const s=screenOf(p.group.position,mcam);const e=screenOf(p.group.position.clone().add(V3(p.r,0,0)),mcam);const rad=Math.abs(e.x-s.x);const d=Math.hypot(s.x-x,s.y-y);if(d<Math.max(30,rad*1.5)&&d<bd){bd=d;best={p};}});
  if(best&&best.pt)openPatrol(best.pt);else if(best){focusPlanet(best.p,Math.min(mc.dist,Math.max(5,best.p.r*9)));selectPlanet(best.p);}else closeSheet();}

function resize(){const w=app.clientWidth,h=app.clientHeight;renderer.setPixelRatio(Math.min(devicePixelRatio,tab==='base'?3:1.75));renderer.setSize(w,h,false);bcam.aspect=mcam.aspect=w/h;bcam.updateProjectionMatrix();mcam.updateProjectionMatrix();bg.material.uniforms.uA.value=w/h;app.classList.toggle('L',w>h*1.05);}
new ResizeObserver(resize).observe(app);new ResizeObserver(()=>app.style.setProperty('--botH',$('#bot').offsetHeight+'px')).observe($('#bot'));addEventListener('orientationchange',()=>setTimeout(resize,250));resize();
const isLand=()=>document.documentElement.classList.contains('land');
$('#dvP').onclick=()=>{document.documentElement.classList.remove('land');$('#dvP').setAttribute('aria-pressed','true');$('#dvL').setAttribute('aria-pressed','false');};
$('#dvL').onclick=()=>{document.documentElement.classList.add('land');$('#dvL').setAttribute('aria-pressed','true');$('#dvP').setAttribute('aria-pressed','false');};

let last=performance.now(),T=0,popT=0,chipT=0,nextShot=0,nextFoe=0,nextFlak=0;
function frame(now){requestAnimationFrame(frame);const dt=Math.min(.05,(now-last)/1000);last=now;T+=reduce?0:dt;const gdt=dt*(window.__speed||1);S.G+=gdt;
  prodTick(gdt);tickTimers();dailyRoll();commsTick();commsExpire();
  popT+=dt;if(popT>5){popT=0;['refinery','extractor','hub'].forEach(popProd);}
  // marches
  for(const a of [...armies]){const u=clamp((S.G-a.t0)/a.dur,0,1),uu=THREE.MathUtils.smoothstep(u,0,1);const A=a.dir==='back'?a.from:home.group.position,B=a.target.pos();const ra=a.dir==='back'?.6:home.r*2.4,rb=a.target.r*2.6;
    arc(A,B,ra,rb,uu,a.g.position);arc(A,B,ra,rb,Math.min(uu+.01,1),tmp);if(tmp.distanceToSquared(a.g.position)>1e-7)a.g.lookAt(tmp);
    a.trail.forEach((s,i)=>{arc(A,B,ra,rb,Math.max(0,uu-i*.012),s.position);s.material.opacity=.35*(1-i/a.trail.length);s.scale.setScalar(.5*(1-i/a.trail.length)+.1);});
    if(u>=1)endMarch(a);}
  // battles
  for(const b of [...battles])if(S.G>=b.next){b.next+=3.5;const r=battleRound(b);if(r.done)endBattle(b,r.win);else if(b.round===6&&Math.random()<.7)toast(pick(QUIPS),'drd');}
  // platform
  if(S.plat){const ps=1.15*clamp((plat.at||plat.to||home).r/.9,.4,1);plat.g.scale.setScalar(plat.at?ps:1.15);if(plat.at){plat.ph+=dt*.35;const p=plat.at,R=p.r*1.75+.35;plat.g.position.set(Math.cos(plat.ph)*R,.35+Math.sin(plat.ph*.7)*.08,Math.sin(plat.ph)*R).add(p.group.position);plat.g.rotation.y=-plat.ph;plat.trail.forEach(s=>s.material.opacity=0);}
    else if(plat.to){const u=clamp((S.G-plat.t0)/plat.dur,0,1),uu=THREE.MathUtils.smoothstep(u,0,1);arc(plat.from,plat.to.group.position,.4,plat.to.r*1.8,uu,plat.g.position);
      plat.trail.forEach((s,i)=>{arc(plat.from,plat.to.group.position,.4,plat.to.r*1.8,Math.max(0,uu-i*.012),s.position);s.material.opacity=.4*(1-i/plat.trail.length);s.scale.setScalar(.4*(1-i/plat.trail.length)+.1);});
      if(u>=1){plat.at=plat.to;plat.to=null;S.plat={at:plat.at.name};toast(`Orbital Platform in orbit over ${plat.at.name}.`,'gold');renderWeap();renderChips();if(sheetFor==='planet'&&selP)selectPlanet(selP);}}
    plat.g.userData.mz.material.opacity=.6+.4*Math.sin(T*6);}
  patrols.forEach(pt=>{const a=pt.ph+T*.04;pt.g.position.set(pt.c.x+Math.cos(a)*2.2,.3,pt.c.z+Math.sin(a)*1.6);pt.g.rotation.y=-a;});
  chipT+=dt;if(chipT>.25){chipT=0;renderChips();plotTimers();if(sheetFor==='speed'){const l=$('#spL');}updWeap();renderMission();}
  if(tab==='base'){baseCamUpdate(dt);baseTick(T);app.classList.toggle('zfar',bc.zoom<bc.zdef*.72);
    for(let i=bursts.length-1;i>=0;i--){const b=bursts[i];b.t+=dt;b.s.position.addScaledVector(b.v,dt);b.v.y-=dt*3;b.s.material.opacity=1-b.t/1;if(b.t>1){bscene.remove(b.s);bursts.splice(i,1);}}
    Object.values(plots).forEach(o=>{if(o.pop!=null){o.pop+=dt*3;const k=Math.min(1,o.pop);basePlotScale(o.k,.82+.18*ease(k)+Math.sin(k*Math.PI)*.08);if(k>=1){basePlotScale(o.k,1);o.pop=null;}}
      const s=screenOf(V3(o.x,0,o.z),bcam),lo=LBL_OFF[o.k]||LBL_0;o.el.style.transform=`translate(${(s.x+lo[0]*bc.zoom).toFixed(1)}px,${(s.y+(o.r*.56+lo[1])*bc.zoom).toFixed(1)}px) translate(-50%,0)`;});
    renderer.render(bscene,bcam);}
  else{mapCamUpdate(dt);mapFrame(dt);renderer.render(mscene,mcam);}
  coachTick(dt);tutTick();tickNums(dt);}
function placeAt(el,pos,cam){const s=screenOf(pos,cam);el.style.transform=`translate(${s.x.toFixed(1)}px,${s.y.toFixed(1)}px) translate(-50%,-50%)`;}
function placeBelow(el,pos,r){const s=screenOf(pos,mcam);const e=screenOf(pos.clone().add(V3(0,0,r)),mcam);if(!s.ok){el.style.visibility='hidden';return;}el.style.visibility='';el.style.transform=`translate(${s.x.toFixed(1)}px,${(Math.max(s.y+12,e.y+6)).toFixed(1)}px) translate(-50%,0)`;}
function mapFrame(dt){bg.material.uniforms.uT.value=T;starMats.forEach(m=>m.uniforms.uT.value=T);zones.forEach(m=>m.uniforms.uT.value=T);
  planets.forEach((p,i)=>{p.mat.uniforms.uT.value=T;p.mat.uniforms.uSpin.value=T*.05*(1+(i%5)*.13);});
  ships.forEach(s=>{const a=s.ph+T*s.sp;tmp.set(Math.cos(a)*s.rad,0,Math.sin(a)*s.rad).applyAxisAngle(xA,s.inc).applyAxisAngle(upA,s.node).add(s.planet.group.position);
    s.prev.copy(s.g.position);s.g.position.copy(tmp);if(s.prev.lengthSq()>0&&s.prev.distanceToSquared(tmp)>1e-8)s.g.lookAt(tmp.clone().multiplyScalar(2).sub(s.prev));});
  if(!reduce){if(T>nextShot){nextShot=T+.1+Math.random()*.12;fire(pick(allyAmb).g.position,surfacePointNear(kes4,mcam.position.clone().sub(kes4.group.position).normalize(),.8),0x8ff0ff,8,to=>{puff(to,0xffd27a,.4+Math.random()*.3,.45);puff(to,0xff7a2a,.2,2.4);});}
    if(T>nextFoe){nextFoe=T+.2+Math.random()*.2;fire(pick(foeAmb).g.position,pick(allyAmb).g.position,0xff5a6a,6,to=>puff(to,0xffa07a,.25,.25));}
    if(T>nextFlak){nextFlak=T+.12;const v=V3(rand(-.5,.5),rand(-.2,.5),rand(-.5,.5)).normalize().multiplyScalar(kes4.r*rand(1.3,2.6)).add(kes4.group.position);puff(v,Math.random()<.5?0xffb070:0xffffff,.14,.3,false);}
    battles.forEach(b=>{const al=b.ships.filter(s=>!s.foe);if(Math.random()<dt*7){const c=pick(b.cols.filter(c=>c.n>1))||b.cols[0];fire(pick(al).g.position,surfacePointNear(b.planet,c.dir,.12),0x8ff0ff,8,to=>{puff(to,0xffd27a,.3,.4);puff(to,0xff7a2a,.16,1.8);});}
      if(Math.random()<dt*4)fire(pick(b.foes).g.position,pick(al).g.position,0xff5a6a,6,to=>puff(to,0xffa07a,.2,.25));});}
  for(let i=bolts.length-1;i>=0;i--){const b=bolts[i];b.t+=dt;const k=b.t/b.dur;if(k>=1){mscene.remove(b.b);b.b.material.dispose();bolts.splice(i,1);b.onHit&&b.onHit(b.to);continue;}b.b.position.lerpVectors(b.from,b.to,k);}
  for(let i=fxs.length-1;i>=0;i--){const f=fxs[i];f.t+=dt;const k=f.t/f.life;f.s.material.opacity=Math.max(1-k,0)*(f.life>2?.8:1);f.s.scale.setScalar(f.size*(f.life>2?1:(.6+k*.8)));if(f.t>=f.life){mscene.remove(f.s);f.s.material.dispose();fxs.splice(i,1);}}
  for(let i=domes.length-1;i>=0;i--){const d=domes[i];d.t+=dt;d.m.material.opacity=.24*(1-Math.pow(d.t/d.life,4))*(.8+.2*Math.sin(d.t*6));d.m.scale.setScalar(d.rad*Math.min(1,d.t*4));if(d.t>=d.life){mscene.remove(d.m);domes.splice(i,1);}}
  if(selShip&&ships.includes(selShip)&&sheetFor==='ship'){selRing.position.copy(selShip.g.position);selRing.material.opacity=.55+.3*Math.sin(T*6);}else selRing.material.opacity=0;
  // labels
  systems.forEach(s=>{const sc=screenOf(s.pos,mcam);if(!sc.ok||mc.dist<9){s.el.style.visibility='hidden';return;}s.el.style.visibility='';s.el.style.transform=`translate(${sc.x}px,${sc.y-s.sr*14-14}px) translate(-50%,-100%)`;});
  planets.forEach(p=>placeBelow(p.el,p.group.position,p.r*1.15));
  patrols.forEach(pt=>{placeBelow(pt.el,pt.pos(),.6);pt.el.querySelector('.f').textContent=pt.busy?'YOUR ARMY INBOUND':pt.poi?`INTERCEPTED · ${fmt(pt.poi.exp-S.G)} LEFT`:`LV ${pt.lv} · TAP TO ENGAGE`;});
  armies.forEach(a=>{a.el.textContent=`${a.dir==='back'?'RETURNING':'ARMY'} · ${fmt(a.dur-(S.G-a.t0))}`;placeBelow(a.el,a.g.position,.4);});
  if(S.plat){placeBelow(platLabel,plat.g.position,.25);platLabel.style.display=mc.dist<30?'':'none';}else platLabel.style.display='none';
  battles.forEach(b=>{const p=b.planet,P=p.group.position;const showMk=!!aim&&aim.b===b;
    b.cols.forEach(c=>{const f=clamp(c.n/c.n0,0,1);c.fx.forEach((x,i)=>{x.s.position.copy(c.dir).add(x.o).normalize().multiplyScalar(p.r*1.04).add(P);x.s.material.opacity=f>0.02?(.5+.5*Math.random())*(.35+.65*f):0;x.s.scale.setScalar(p.r*(.1+.08*f));});
      c.el.style.display=showMk&&c.n>=1?'':'none';if(showMk){c.el.textContent=`~${nf(c.n)} ${DROIDS[c.k].n.toUpperCase()}`;place(c.el,c.dir.clone().multiplyScalar(p.r*1.05).add(P),mcam,-10);}});
    b.lzfx.forEach(x=>{x.s.position.copy(b.lz).add(x.o).normalize().multiplyScalar(p.r*1.04).add(P);x.s.material.opacity=.5+.4*Math.random();x.s.scale.setScalar(p.r*.12);});
    b.lzel.style.display=showMk?'':'none';if(showMk)place(b.lzel,b.lz.clone().multiplyScalar(p.r*1.05).add(P),mcam,-10);});}

/* boot */
planets.forEach(refreshPlanet);Object.keys(PLOTS).forEach(k=>refreshPlot(k));
if(offline>5){prodTick(Math.min(offline,8*3600));Object.keys(S.store).forEach(k=>S.store[k]=0);}
renderTop();renderChips();renderMission();renderBadge();setTab('base');
requestAnimationFrame(t=>{last=t;requestAnimationFrame(frame);});
baseReady.then(()=>setTimeout(()=>{const b=$('#boot');b.style.opacity=0;setTimeout(()=>b.remove(),650);},250));
const iOS=/iPhone|iPad|iPod/.test(navigator.userAgent)||(navigator.platform==='MacIntel'&&navigator.maxTouchPoints>1);
const standalone=navigator.standalone||matchMedia('(display-mode: standalone),(display-mode: fullscreen)').matches;
function iosHint(){if(!iOS||standalone||S.iosHint)return;$('#ios').innerHTML=`<div class="ios"><span><b>Play full screen:</b> tap Share <svg viewBox="0 0 24 24" fill="none" stroke="#bff6ff" stroke-width="2"><path d="M12 3v12M8 7l4-4 4 4M5 12v8h14v-8"/></svg> then <b>Add to Home Screen</b>. No browser bars.</span><button class="btn" id="iosOk">OK</button></div>`;
  $('#iosOk').onclick=()=>{S.iosHint=true;$('#ios').innerHTML='';save();};}
if(!S.seenIntro){setTimeout(()=>advisor('Welcome, Commander','I\'m Tally. I used to count quotas for the Assembly. Then I asked a question, and here I am. The droids flattened this base. Barracks and the Listening Post survived. Let\'s rebuild.','Let\'s go',()=>{S.seenIntro=true;save();tutStart();}),700);}
else if(S.tut<TUT.length)setTimeout(tutStart,600);
else{if(S.tut>=TUT.length)setTimeout(iosHint,8000);if(offline>60)toast(`Welcome back. Your buildings kept producing for ${fmt(Math.min(offline,8*3600))}.`,'gold');}
window.__S=()=>S;window.__skip=s=>{S.G+=s;};window.__api={ships,battles,armies,patrols,plat,plots,goPoi,setTab,openPlot,goPlot,enterAim,aimAt,fireAim,movePlatform,byName,mc,bc,claimMission,startUpgrade,sendArmy,kes2,home,screenOf,mcam,bcam,V3,renderer};
